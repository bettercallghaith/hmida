services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: whatsapp-mcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_mcp}
      POSTGRES_USER: ${POSTGRES_USER:-whatsapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api-gateway/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5433}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatsapp} -d ${POSTGRES_DB:-whatsapp_mcp}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: whatsapp-mcp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_EXTERNAL_PORT:-6380}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp-network

  # WhatsApp Engine (Node.js/Baileys)
  whatsapp-engine:
    build:
      context: ./whatsapp-engine
      dockerfile: Dockerfile
    container_name: whatsapp-mcp-engine
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_mcp}
      POSTGRES_USER: ${POSTGRES_USER:-whatsapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_GATEWAY_URL: http://api-gateway:8000
    volumes:
      - whatsapp_sessions:/app/sessions
      - whatsapp_media:/app/media
    ports:
      - "${WHATSAPP_ENGINE_PORT:-3456}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - whatsapp-network

  # FastAPI Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: whatsapp-mcp-gateway
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_mcp}
      POSTGRES_USER: ${POSTGRES_USER:-whatsapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WHATSAPP_ENGINE_URL: http://whatsapp-engine:3001
      API_SECRET_KEY: ${API_SECRET_KEY:-generate_a_secure_random_string_here}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_GATEWAY_PORT:-8765}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      whatsapp-engine:
        condition: service_started
    networks:
      - whatsapp-network

  # MCP Server
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: whatsapp-mcp-server
    restart: unless-stopped
    environment:
      API_GATEWAY_URL: http://api-gateway:8000
      MCP_API_KEY: ${MCP_API_KEY:-internal_service_key_change_me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${MCP_SERVER_PORT:-8766}:8001"
    depends_on:
      - api-gateway
    networks:
      - whatsapp-network

networks:
  whatsapp-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  whatsapp_sessions:
  whatsapp_media:
